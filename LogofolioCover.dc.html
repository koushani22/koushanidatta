<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Anybody:wdth,wght@50..150,100..900&family=IBM+Plex+Mono:wght@300;600&display=swap" rel="stylesheet" />
<style id="kos-mobile">
@media (max-width: 760px) {
  html, body { overflow-x: hidden; }
  [style*="grid-template-columns: repeat(2"]:not([data-slide-wrap] *),
  [style*="grid-template-columns: repeat(3"]:not([data-slide-wrap] *),
  [style*="grid-template-columns: repeat(4"]:not([data-slide-wrap] *),
  [style*="grid-template-columns: 1fr 1fr"]:not([data-slide-wrap] *),
  [style*="grid-template-columns: minmax(0px, 1fr) minmax(0px, 1.2fr)"]:not([data-slide-wrap] *),
  [style*="grid-template-columns: minmax(96px, auto) minmax(0px, 1fr) auto"]:not([data-slide-wrap] *) { grid-template-columns: minmax(0, 1fr) !important; }
  [style*="justify-self: end"]:not([data-slide-wrap] *) { justify-self: start !important; text-align: left !important; }
  [style*="white-space: nowrap"]:not([data-slide-wrap] *) { white-space: normal !important; }
}
</style>
  <script src="./lazy-video.js"></script>
</helmet>
<div data-screen-label="Logofolio cover" style="position:relative;width:100%;height:100%;min-height:100%;aspect-ratio:16 / 9;container-type:inline-size;overflow:hidden;background:linear-gradient(180deg,#CFC8F0 0%,#E6E1F4 58%,#F6F2EC 100%);color:#14110F;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3.4cqw;">
  <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:1.15cqw;letter-spacing:0.3em;text-transform:uppercase;color:#4A3E8C;">Marks · Symbols · Wordmarks</span>
  <div style="display:flex;align-items:baseline;justify-content:center;height:20cqw;line-height:1;margin-bottom:3cqw;">
    <sc-for list="{{ letters }}" as="l" hint-placeholder-count="9">
      <span style="{{ l.style }}">{{ l.ch }}</span>
    </sc-for>
  </div>
  <span style="font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:1.15cqw;letter-spacing:0.3em;text-transform:uppercase;color:#6B625B;">Koushani Datta · 2019 — 2026</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const WORD = 'Logofolio'.split('');
const S = [
  { fontFamily: "'Anybody',sans-serif", fontVariationSettings: "'wdth' 150,'wght' 900", fontSize: '15cqw', letterSpacing: '-0.03em' },
  { fontFamily: "'Anybody',sans-serif", fontVariationSettings: "'wdth' 50,'wght' 300", fontSize: '15cqw', letterSpacing: '-0.02em' },
  { fontFamily: "'Instrument Serif',serif", fontStyle: 'italic', fontSize: '16.5cqw', letterSpacing: '-0.02em' },
  { fontFamily: "'IBM Plex Mono',monospace", fontWeight: 300, fontSize: '13cqw', letterSpacing: '-0.04em' },
  { fontFamily: "'Instrument Serif',serif", fontSize: '16.5cqw', letterSpacing: '-0.02em' }
];
const SEED = [0, 0, 1, 2, 0, 3, 4, 0, 4];
class Component extends DCLogic {
  state = { idx: SEED.slice(), hot: -1, red: 8 };
  componentDidMount() {
    this.t = setInterval(() => {
      this.setState(s => {
        const idx = s.idx.slice(), k = Math.floor(Math.random() * idx.length);
        let n; do { n = Math.floor(Math.random() * S.length); } while (n === idx[k]);
        idx[k] = n;
        const red = Math.random() < 0.25 ? Math.floor(Math.random() * idx.length) : s.red;
        return { idx, hot: k, red };
      });
    }, 260);
  }
  componentWillUnmount() { clearInterval(this.t); }
  renderVals() {
    const { idx, hot, red } = this.state;
    return {
      letters: WORD.map((ch, i) => ({ ch, style: Object.assign({ display: 'inline-block', lineHeight: 1, color: i === red ? '#C41E2A' : '#14110F', transform: i === hot ? 'translateY(-0.04em)' : 'none', transition: 'transform .35s cubic-bezier(.16,.8,.24,1), color .3s' }, S[idx[i]], (ch === 'L' || ch === 'l') ? { fontSize: 'calc(' + S[idx[i]].fontSize + ' * 1.35)' } : {}) }))
    };
  }
}
</script>
</body>
</html>
