<html lang="en">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Logofolio — Koushani Datta</title>

<link rel="icon" type="image/png" href="favicon.png">

<style>
*{box-sizing:border-box}
html{background:#F6F2EC;color:#14110F;scroll-padding-top:84px}
body{margin:0;font-family:'DM Sans',system-ui,sans-serif}
a{color:inherit;text-underline-offset:5px}
a:hover{color:#C41E2A}
a:focus-visible,button:focus-visible{outline:3px solid #C41E2A;outline-offset:5px}
button{font:inherit;cursor:pointer}
.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px clamp(16px,4vw,56px);background:#F6F2EC;border-bottom:1px solid #DCD5D1}
.topbar a{display:inline-flex;align-items:center;min-height:44px;font:600 11px/1.4 'IBM Plex Mono',monospace;letter-spacing:.08em;text-transform:uppercase}
.name{text-decoration:none}
main{max-width:1520px;margin:auto;padding:44px clamp(16px,4vw,56px) 80px}
.intro{margin-bottom:32px}
h1{margin:0 0 14px;font:400 clamp(58px,9vw,112px)/1 'Instrument Serif',Georgia,serif;letter-spacing:-.035em}
.intro p{margin:0;color:#3A3550;font-size:16px;line-height:1.6}
.cover{display:block;width:100%;height:auto;aspect-ratio:1672/941;object-fit:contain;border-radius:12px;margin-bottom:clamp(40px,6vw,80px)}
.project{margin:0 0 clamp(36px,5vw,72px)}
.project-heading{display:flex;align-items:baseline;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;margin-bottom:16px}
.project-heading h2{margin:0;font-size:clamp(21px,2.2vw,30px);line-height:1.25;font-weight:600}
.project-heading p{margin:0;color:#3A3550;font-size:14px;line-height:1.5}
.panels{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.logo-panel{position:relative;display:grid;place-items:center;width:100%;aspect-ratio:3/2;min-height:240px;padding:40px 20px 48px;border:0;border-radius:12px;overflow:hidden;background:var(--panel-bg);color:var(--panel-ink)}
.logo-art{position:relative;display:block;flex:none;width:76%;max-width:440px}
.logo-art--crop{overflow:hidden}
.logo-art--crop img{position:absolute;display:block;height:auto;max-width:none}
.logo-art--enduro{aspect-ratio:1470/459;background:var(--logo-tone);-webkit-mask:url('assets/logofolio/enduro-white.png') center/contain no-repeat;mask:url('assets/logofolio/enduro-white.png') center/contain no-repeat}
.logo-art--portrait{width:45%;max-width:270px}
.logo-art--wide{width:92%;max-width:600px}
.panel-label{position:absolute;left:20px;right:20px;bottom:16px;display:flex;justify-content:space-between;gap:12px;font:500 12px/1.5 'IBM Plex Mono',monospace}
.footer-link{display:inline-flex;align-items:center;min-height:44px;font:500 13px/1.5 'IBM Plex Mono',monospace}
dialog{width:min(1000px,calc(100% - 24px));max-height:calc(100svh - 24px);padding:0;border:0;border-radius:12px;background:#F6F2EC;color:#14110F;overflow:auto}
dialog::backdrop{background:rgba(20,17,15,.82)}
.detail-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}
.detail-heading h2{margin:0;font-size:16px;line-height:1.4;font-weight:500}
.detail-close{flex:none;min-height:44px;min-width:64px;padding:8px 12px;border:1px solid #CDC4C0;border-radius:8px;background:#F6F2EC;color:#14110F}
.detail-stage{height:min(70svh,640px);min-height:280px;display:grid;place-items:center;overflow:hidden;padding:28px 16px;background:var(--panel-bg)}
.detail-stage .logo-art{width:88%;max-width:820px}
.detail-stage .logo-art--portrait{width:min(54svh,74vw,440px)}
.detail-tools{display:flex;justify-content:flex-end;padding:0 16px 8px}
.detail-zoom{min-height:44px;padding:8px 12px;border:1px solid #CDC4C0;border-radius:8px;background:#F6F2EC;color:#14110F}
.detail-stage.is-zoomed{display:block;overflow:auto}
.detail-stage.is-zoomed .logo-art{max-width:none}
@media(max-width:760px){
  main{padding-top:32px}
  .panels{grid-template-columns:minmax(0,1fr);gap:12px}
  .logo-panel{aspect-ratio:4/3;min-height:228px;padding:32px 12px 44px}
  .logo-art{width:84%}
  .logo-art--portrait{width:48%}
  .logo-art--wide{width:96%}
  .project-heading{display:block}
  .project-heading p{margin-top:6px}
  .cover{margin-bottom:40px}
}
</style>
</head>
<body>
<nav class="topbar" aria-label="Project navigation"><a class="name" href="Cover Monument.dc.html">Koushani Datta</a><a href="Cover Monument.dc.html#work">← All work</a></nav>
<main>
<header class="intro"><h1>Logofolio</h1><p>Selected logos and visual identities. Tap a logo to view it larger.</p></header>
<img class="cover" src="assets/logofolio/cover-wide.webp" width="1672" height="941" alt="">
<article class="project" aria-labelledby="enduro-title">
  <header class="project-heading"><h2 id="enduro-title">Enduro Strides</h2><p>Running</p></header>
  <div class="panels"><button type="button" class="logo-panel" style="--panel-bg:#FFFFFF;--panel-ink:#0011C6;" data-logo-name="Enduro Strides · Colour" aria-label="Enlarge Enduro Strides colour logo" aria-haspopup="dialog" aria-controls="logo-detail"><span class="logo-art logo-art--enduro" role="img" aria-label="Enduro Strides logo" style="--logo-tone:#0011C6;"></span><span class="panel-label">Colour <span aria-hidden="true">↗</span></span></button>
<button type="button" class="logo-panel" style="--panel-bg:#0011C6;--panel-ink:#FFFFFF;" data-logo-name="Enduro Strides · Reversed" aria-label="Enlarge Enduro Strides reversed logo" aria-haspopup="dialog" aria-controls="logo-detail"><span class="logo-art logo-art--enduro" role="img" aria-label="Enduro Strides logo" style="--logo-tone:#FFFFFF;"></span><span class="panel-label">Reversed <span aria-hidden="true">↗</span></span></button></div></article>
<article class="project" aria-labelledby="gate-title">
  <header class="project-heading"><h2 id="gate-title">Gate 4 Films</h2><p>Film production</p></header>
  <div class="panels"><button type="button" class="logo-panel" style="--panel-bg:#F6F6F6;--panel-ink:#141414;" data-logo-name="Gate 4 Films · Colour" aria-label="Enlarge Gate 4 Films colour logo" aria-haspopup="dialog" aria-controls="logo-detail"><span class="logo-art logo-art--crop" style="aspect-ratio:1258/905;"><img loading="lazy" decoding="async" src="assets/logofolio/gate4-black-full.png" width="1358" height="1005" alt="Gate 4 Films logo" style="width:107.94912559618442%;left:-3.97456279809221%;top:-5.524861878453039%;"></span><span class="panel-label">Colour <span aria-hidden="true">↗</span></span></button>
<button type="button" class="logo-panel" style="--panel-bg:#141414;--panel-ink:#F6F6F6;" data-logo-name="Gate 4 Films · Reversed" aria-label="Enlarge Gate 4 Films reversed logo" aria-haspopup="dialog" aria-controls="logo-detail"><span class="logo-art logo-art--crop" style="aspect-ratio:1258/905;"><img loading="lazy" decoding="async" src="assets/logofolio/gate4-white-full.png" width="1358" height="1005" alt="Gate 4 Films logo in reversed colours" style="width:107.94912559618442%;left:-3.97456279809221%;top:-5.524861878453039%;"></span><span class="panel-label">Reversed <span aria-hidden="true">↗</span></span></button></div></article>
<article class="project" aria-labelledby="courier-title">
  <header class="project-heading"><h2 id="courier-title">Courier Connected</h2><p>Logistics</p></header>
  <div class="panels"><button type="button" class="logo-panel" style="--panel-bg:#FFFFFF;--panel-ink:#1553C9;" data-logo-name="Courier Connected · Colour" aria-label="Enlarge Courier Connected colour logo" aria-haspopup="dialog" aria-controls="logo-detail"><span class="logo-art logo-art--crop" style="aspect-ratio:1720/420;"><img loading="lazy" decoding="async" src="assets/logofolio/cc-blue.png" width="1720" height="420" alt="Courier Connected logo" style="width:100%;left:0%;top:0%;"></span><span class="panel-label">Colour <span aria-hidden="true">↗</span></span></button>
<button type="button" class="logo-panel" style="--panel-bg:#1553C9;--panel-ink:#FFFFFF;" data-logo-name="Courier Connected · Reversed" aria-label="Enlarge Courier Connected reversed logo" aria-haspopup="dialog" aria-controls="logo-detail"><span class="logo-art logo-art--crop" style="aspect-ratio:1720/420;"><img loading="lazy" decoding="async" src="assets/logofolio/cc-white.png" width="1720" height="420" alt="Courier Connected logo in reversed colours" style="width:100%;left:0%;top:0%;"></span><span class="panel-label">Reversed <span aria-hidden="true">↗</span></span></button></div></article>
<article class="project" aria-labelledby="lumi-title">
  <header class="project-heading"><h2 id="lumi-title">Lumi Club</h2><p>Kids’ club</p></header>
  <div class="panels"><button type="button" class="logo-panel" style="--panel-bg:#F6F2EC;--panel-ink:#182222;" data-logo-name="Lumi Club · Colour" aria-label="Enlarge Lumi Club colour logo" aria-haspopup="dialog" aria-controls="logo-detail"><span class="logo-art logo-art--crop logo-art--portrait" style="aspect-ratio:803/873;"><img loading="lazy" decoding="async" src="assets/logofolio/lumi-colour.png" width="1254" height="1254" alt="Lumi Club logo" style="width:156.16438356164383%;left:-28.393524283935246%;top:-21.878579610538374%;"></span><span class="panel-label">Colour <span aria-hidden="true">↗</span></span></button>
<button type="button" class="logo-panel" style="--panel-bg:#182222;--panel-ink:#F6F2EC;" data-logo-name="Lumi Club · Reversed" aria-label="Enlarge Lumi Club reversed logo" aria-haspopup="dialog" aria-controls="logo-detail"><span class="logo-art logo-art--crop logo-art--portrait" style="aspect-ratio:803/873;"><img loading="lazy" decoding="async" src="assets/logofolio/lumi-reversed.png" width="1254" height="1254" alt="Lumi Club logo in reversed colours" style="width:156.16438356164383%;left:-28.393524283935246%;top:-21.878579610538374%;"></span><span class="panel-label">Reversed <span aria-hidden="true">↗</span></span></button></div></article>
<article class="project" aria-labelledby="pauls-title">
  <header class="project-heading"><h2 id="pauls-title">Paul’s Residency</h2><p>Homestay · Lamahatta, Darjeeling</p></header>
  <div class="panels"><button type="button" class="logo-panel" style="--panel-bg:#F6F2EC;--panel-ink:#2F3A2A;" data-logo-name="Paul’s Residency · Colour" aria-label="Enlarge Paul’s Residency colour logo" aria-haspopup="dialog" aria-controls="logo-detail"><span class="logo-art logo-art--crop logo-art--wide" style="aspect-ratio:1071/505;"><img loading="lazy" decoding="async" src="assets/logofolio/pauls-logo-clean.png" width="1160" height="600" alt="Paul’s Residency logo" style="width:108.30999066293184%;left:-4.1083099906629315%;top:-8.514851485148515%;"></span><span class="panel-label">Colour <span aria-hidden="true">↗</span></span></button>
<button type="button" class="logo-panel" style="--panel-bg:#2F3A2A;--panel-ink:#F6F2EC;" data-logo-name="Paul’s Residency · Reversed" aria-label="Enlarge Paul’s Residency reversed logo" aria-haspopup="dialog" aria-controls="logo-detail"><span class="logo-art logo-art--crop logo-art--wide" style="aspect-ratio:1071/505;"><img loading="lazy" decoding="async" src="assets/logofolio/pauls-reversed.png" width="1160" height="600" alt="Paul’s Residency logo in reversed colours" style="width:108.30999066293184%;left:-4.1083099906629315%;top:-8.514851485148515%;"></span><span class="panel-label">Reversed <span aria-hidden="true">↗</span></span></button></div></article>

</main>
<dialog id="logo-detail" aria-labelledby="logo-detail-title">
<div class="detail-heading"><h2 id="logo-detail-title"></h2><button class="detail-close" type="button">Close ×</button></div>
<div class="detail-tools"><button class="detail-zoom" type="button" aria-pressed="false">Zoom in</button></div>
<div class="detail-stage"></div>
</dialog>
<script>
(function(){
 const dialog=document.getElementById('logo-detail'),stage=dialog.querySelector('.detail-stage'),title=document.getElementById('logo-detail-title');
 const zoom=dialog.querySelector('.detail-zoom');let trigger,zoomed=false;
 function fit(){zoomed=false;zoom.textContent='Zoom in';zoom.setAttribute('aria-pressed','false');stage.classList.remove('is-zoomed');const art=stage.firstElementChild;if(art){art.style.removeProperty('width');art.style.removeProperty('max-width');}}
 zoom.addEventListener('click',()=>{if(zoomed){fit();return;}const art=stage.firstElementChild;if(!art)return;const width=art.getBoundingClientRect().width,image=art.querySelector('img');const natural=image&&image.naturalWidth?image.naturalWidth/(parseFloat(image.style.width)/100):1470;art.style.width=Math.max(width,Math.min(width*2,natural))+'px';art.style.maxWidth='none';stage.classList.add('is-zoomed');zoomed=true;zoom.textContent='Fit view';zoom.setAttribute('aria-pressed','true');});
 document.querySelectorAll('[data-logo-name]').forEach(button=>button.addEventListener('click',()=>{
  trigger=button;title.textContent=button.dataset.logoName;
  stage.style.setProperty('--panel-bg',button.style.getPropertyValue('--panel-bg'));
  const art=button.querySelector('.logo-art').cloneNode(true);
  art.querySelectorAll('img').forEach(image=>image.loading='eager');
  stage.replaceChildren(art);fit();dialog.showModal();
 }));
 dialog.querySelector('.detail-close').addEventListener('click',()=>dialog.close());
 dialog.addEventListener('click',event=>{if(event.target===dialog)dialog.close()});
 dialog.addEventListener('close',()=>{stage.replaceChildren();if(trigger)trigger.focus()});
})();
</script>
